services:
  viewer:
    build:
      context: .
      dockerfile: src/Dockerfile
    networks:
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.zpl.rule: Host(`zpl.runfosa.local`)
      traefik.http.routers.zpl.entrypoints: web
      traefik.http.services.zpl.loadbalancer.server.port: "80"

networks:
  traefik-public:
    external: true
